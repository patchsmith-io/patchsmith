name: Prerelease

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1
  PATCHSMITH_OTEL_DISABLED: true
  OTEL_SDK_DISABLED: true

jobs:
  select-mode:
    name: Select release mode
    if: github.repository == 'patchsmith-io/patchsmith' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.changesets.outputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm for Changesets
        uses: pnpm/action-setup@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 24
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check release policy
        run: vp run release:check

      - name: Select Changesets mode
        id: changesets
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Update version PR
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-version
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm for Changesets
        uses: pnpm/action-setup@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 24
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Generate release app token
        id: release-app
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update version PR
        uses: changesets/action/version@v2.1.2
        with:
          script: vp run release:version
          commit-message: "chore: version beta packages"
          pr-title: "chore: version beta packages"
          pr-base-branch: main
          github-token: ${{ steps.release-app.outputs.token }}

  publish:
    name: Publish prerelease
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm for Changesets
        uses: pnpm/action-setup@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 24
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Set up Turborepo Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Build and publish prerelease
        uses: changesets/action/publish@v2.1.2
        with:
          script: vp run release:publish
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
