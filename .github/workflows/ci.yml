name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1
  PATCHSMITH_OTEL_DISABLED: true
  OTEL_SDK_DISABLED: true

jobs:
  quality:
    name: Lint, Format and Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Set up Turborepo Remote Cache
        # Cache availability must not prevent the verification steps from running.
        continue-on-error: true
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Check package licenses
        run: vp run licenses:check

      - name: Check release policy
        run: vp run release:check

      - name: Build
        run: vp run build

      - name: Lint
        run: vp run lint

      - name: Format
        run: vp run format

      - name: Typecheck
        run: vp run check-types

  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Set up Turborepo Remote Cache
        # Cache availability must not prevent the verification steps from running.
        continue-on-error: true
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Run tests
        # Each package also starts its own test workers; budget both levels on this 4-vCPU runner.
        run: vp run test --concurrency=2

      - name: Test release policy
        run: vp exec turbo run test:release --filter=//
