name: Run database migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-db-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate production database
    runs-on: ubuntu-latest
    environment: production-platform
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Validate migration database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty. Add PRODUCTION_MIGRATION_DATABASE_URL to the production-platform GitHub Environment."
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}

      - name: Run Drizzle migrations
        run: vp run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}

      - name: "notify vercel"
        uses: "vercel/repository-dispatch/actions/status@v1"
        with:
          name: "Vercel - patchsmith-web: Database Migrations"
