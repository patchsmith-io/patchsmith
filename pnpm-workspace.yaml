minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
# Temporary exception authorized for the Ultracite migration.
minimumReleaseAgeExclude:
  - ultracite@8.0.0
  # Authorized for patch-free whole-turn FX execution.
  - "@ai-sdk/harness-fx@1.0.80"
  - "@ai-sdk/harness@1.0.164"
  - "@ai-sdk/sandbox-vercel@1.0.164"
  - "@ai-sdk/workflow-harness@1.0.164"
  - "@ai-sdk/mcp@2.0.84"
  - "@ai-sdk/provider@4.0.34"
  - "@ai-sdk/provider-utils@5.0.68"
  - "@ai-sdk/gateway@4.0.126"
  - "ai@7.0.153"
  # Native libfx and isolated runtime auth require these releases (older fx uses ACP).
  - "@ai-sdk/harness@1.0.154"
  - "@ai-sdk/mcp@2.0.78"
  - "@ai-sdk/provider@4.0.29"
  - "@ai-sdk/provider-utils@5.0.62"
  - "@ai-sdk/gateway@4.0.116"
  - "ai@7.0.143"
  - "@ai-sdk/workflow-harness@1.0.154"
  - "@ai-sdk/sandbox-vercel@1.0.154"
virtualStoreType: global

overrides:
  # Keep auth plugin registries and Drizzle types on identical peer instances.
  nanostores@*: 1.5.4
  arktype@*: 2.2.7
  "drizzle-orm>zod": "catalog:"
  effect@*: "catalog:"
  "@tanstack/react-start": "catalog:"
  vite@*: "catalog:"
  vitest@*: "catalog:"

packages:
  - apps/*
  - playground/*
  - playground/apps/*
  - packages/*

# FX 1.0.80 uses the newer AI SDK harness; keep the Pi agent on its catalog.
catalogs:
  fx:
    ai: 7.0.153

catalog:
  "@ai-sdk/react": ^3.0.192
  "@orpc/client": 2.0.0-beta.40
  "@orpc/contract": 2.0.0-beta.40
  "@orpc/experimental-effect": 2.0.0-beta.40
  "@orpc/opentelemetry": 2.0.0-beta.40
  "@orpc/openapi": 2.0.0-beta.40
  "@orpc/ratelimit": 2.0.0-beta.40
  "@orpc/server": 2.0.0-beta.40
  "@orpc/tanstack-query": 2.0.0-beta.40
  "@orpc/zod": 2.0.0-beta.40
  "@opentelemetry/api": ^1.9.1
  "@opentelemetry/exporter-trace-otlp-http": ^0.218.0
  "@opentelemetry/instrumentation-http": ^0.223.0
  "@opentelemetry/instrumentation-pg": ^0.76.0
  "@opentelemetry/instrumentation-undici": ^0.33.0
  "@opentelemetry/resources": ^2.7.1
  "@opentelemetry/sdk-node": ^0.218.0
  "@opentelemetry/sdk-trace-base": ^2.12.0
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-router": 1.170.45
  "@tanstack/react-router-devtools": 1.167.2
  "@tanstack/react-start": 1.169.3
  "@types/node": 26.6.4
  "@types/pg": ^8.23.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  "@vercel/otel": ^2.1.3
  ai: ^7.0.143
  better-auth: 1.7.10
  class-variance-authority: ^0.7.1
  dotenv: ^18.0.8
  drizzle-kit: 1.0.0-rc.4-5d5b77c
  drizzle-orm: 1.0.0-rc.4-5d5b77c
  effect: 4.0.5
  nanoid: ^6.0.2
  lucide-react: 1.59.0
  next-themes: 0.4.6
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.3
  tsx: ^4.23.15
  typescript: ^7.0.2
  valibot: ^1.5.0
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  zod: ^4.6.7
  vite-plus: 1.3.0
  vitest: 5.0.1

# Helps speed up vercel deployments
cacheDir: node_modules/.cache/pnpm

allowBuilds:
  "@google/genai": false
  "@swc/core": false
  cbor-extract: false
  workerd: true
  "@prisma/client": false
  better-sqlite3: false
  esbuild: false
  lefthook: true
  msw: false
  protobufjs: false
  sharp: false
  "@scarf/scarf": true
  keytar: true
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
